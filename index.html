<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motoviajes Asunción</title>
<style>
body{font-family:Arial,sans-serif;background:#f0f4f8;margin:0;color:#183047}
header{background:#123653;color:white;padding:24px;text-align:center}
main{max-width:500px;margin:20px auto;padding:15px}
.card{background:white;padding:20px;border-radius:16px;margin-bottom:16px;box-shadow:0 3px 12px #0001}
label{display:block;margin-top:12px;font-weight:bold}
input{box-sizing:border-box;width:100%;padding:12px;margin-top:6px;border:1px solid #ccd5df;border-radius:8px}
button{width:100%;padding:14px;margin-top:16px;background:#ff941f;border:0;border-radius:9px;font-weight:bold;font-size:16px}
.result{background:#e7f4ff;padding:14px;border-radius:10px;margin-top:14px}
</style>
</head>
<body>
<header><h1>🏍️ Motoviajes</h1><p>Tu viaje por Asunción</p></header>
<main>
<div class="card">
<h2>Solicitar un viaje</h2>
<label>Tu nombre</label><input id="nombre" placeholder="Tu nombre">
<label>Desde</label><input id="origen" placeholder="Punto de partida">
<label>Hasta</label><input id="destino" placeholder="Destino">
<label>Precio estimado (Gs.)</label><input id="precio" type="number" min="0" value="20000">
<div class="result"><b>Comisión Motoviajes (20%):</b><h2 id="comision">Gs. 4.000</h2><p id="resto">Para el motociclista: Gs. 16.000</p></div>
<button onclick="solicitar()">Solicitar viaje de prueba</button>
<p id="mensaje"></p>
</div>
<div class="card"><h3>Pago</h3><p>💵 Efectivo al motociclista</p><p>📍 Zona inicial: Asunción, Paraguay</p></div>
</main>
<script>
const precio=document.getElementById('precio');
function calcular(){
 let p=Math.max(0,Number(precio.value)||0);
 document.getElementById('comision').textContent='Gs. '+Math.round(p*.2).toLocaleString('es-PY');
 document.getElementById('resto').textContent='Para el motociclista: Gs. '+Math.round(p*.8).toLocaleString('es-PY');
}
precio.addEventListener('input',calcular);


function solicitar(){
  const nombre = document.getElementById('nombre').value.trim();
  const origen = document.getElementById('origen').value.trim();
  const destino = document.getElementById('destino').value.trim();
  const precio = Math.max(0, Number(document.getElementById('precio').value) || 0);

  if (!nombre || !origen || !destino || precio <= 0) {
    document.getElementById('mensaje').textContent =
      'Completá tu nombre, origen, destino y precio estimado.';
    return;
  }

  const comision = precio * 0.20;
  const resto = precio - comision;
  const texto = `Hola, quiero solicitar un viaje en Motoviajes.
Pasajero: ${nombre}
Origen: ${origen}
Destino: ${destino}
Precio estimado: Gs. ${precio.toLocaleString('es-PY')}
Comisión Motoviajes (20%): Gs. ${comision.toLocaleString('es-PY')}
Resto para el conductor: Gs. ${resto.toLocaleString('es-PY')}
Pago: Efectivo`;

  document.getElementById('mensaje').textContent =
    'Abriendo WhatsApp para enviar tu solicitud...';

  window.open(
    'https://wa.me/595982271940?text=' + encodeURIComponent(texto),
    '_blank'
  );
 }
 calcular();
</script>
 
<section id="registro-motociclistas" style="max-width:500px;margin:30px auto;padding:20px;border:1px solid #ddd;border-radius:12px;font-family:Arial,sans-serif">
  <h2>🏍️ Registro de motociclistas</h2>
  <p>Registra tus datos para recibir solicitudes de viaje.</p>

  <form id="form-motociclista">
    <label for="nombre-moto">Nombre del motociclista</label>
    <input id="nombre-moto" type="text" required placeholder="Tu nombre" style="display:block;width:100%;box-sizing:border-box;padding:12px;margin:8px 0 16px">

    <label for="telefono-moto">WhatsApp (con código de país)</label>
    <input id="telefono-moto" type="tel" required placeholder="595981234567" style="display:block;width:100%;box-sizing:border-box;padding:12px;margin:8px 0 16px">

    <label for="zona-moto">Zona donde trabajas</label>
    <input id="zona-moto" type="text" required placeholder="Ej.: San Lorenzo" style="display:block;width:100%;box-sizing:border-box;padding:12px;margin:8px 0 16px">

    <button type="submit" style="width:100%;padding:14px;background:#16803c;color:white;border:0;border-radius:8px;font-weight:bold">
      Contactar por WhatsApp
    </button>
  </form>
</section>

<script>
document.getElementById("form-motociclista").addEventListener("submit", function(e) {
  e.preventDefault();

  const nombre = document.getElementById("nombre-moto").value.trim();
  const telefono = document.getElementById("telefono-moto").value.replace(/\D/g, "");
  const zona = document.getElementById("zona-moto").value.trim();

  if (!nombre || !telefono || !zona) {
    alert("Completa todos los campos.");
    return;
  }

  const mensaje = "Hola, quiero registrarme como motociclista en Motoviajes.%0A" +
    "Nombre: " + encodeURIComponent(nombre) + "%0A" +
    "WhatsApp: " + encodeURIComponent(telefono) + "%0A" +
    "Zona: " + encodeURIComponent(zona);

  window.open("https://wa.me/595982271940?text=" + mensaje, "_blank");
</script>
 
</body>
</html>
